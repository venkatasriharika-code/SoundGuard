<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">SoundGuard: acoustic anomaly detection</title>
<desc id="d">An animated waveform of a machine. A scan line sweeps across; the first part is healthy sound labelled normal, the last part has a fault and is labelled anomaly.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1410"/><stop offset="1" stop-color="#101c15"/></linearGradient>
  <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8ff47"/><stop offset="1" stop-color="#4f9a2c"/></linearGradient>
  <linearGradient id="gbad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a6a"/><stop offset="1" stop-color="#d1352b"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fe3ff" stop-opacity="0"/><stop offset="1" stop-color="#7fe3ff" stop-opacity=".55"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="wave"><rect x="56" y="150" width="1088" height="290"/></clipPath>
</defs>
<style>
  .sans{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
  .b{transform-box:fill-box;transform-origin:center;animation-name:eq;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  @keyframes eq{0%,100%{transform:scaleY(.30)}50%{transform:scaleY(1)}}
  .sweep{animation:sweep 8s linear infinite}
  @keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(1080px)}}
  .ok{animation:okf 8s linear infinite}
  @keyframes okf{0%,66%{opacity:1}70%,100%{opacity:0}}
  .bad{animation:badf 8s linear infinite;opacity:0}
  @keyframes badf{0%,68%{opacity:0}72%,96%{opacity:1}100%{opacity:0}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.4s ease-out infinite}
  @keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
  .flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .blink{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.b,.sweep,.ok,.bad,.ring,.flow,.blink{animation:none!important}.bad{opacity:1}}
</style>
<rect width="1200" height="470" rx="26" fill="url(#bg)"/>
<rect width="1200" height="470" rx="26" fill="url(#grid)"/>
<rect x="1.5" y="1.5" width="1197" height="467" rx="25" fill="none" stroke="#c8ff47" stroke-opacity=".18"/>

<circle cx="72" cy="62" r="6" fill="#c8ff47" class="blink" filter="url(#glow)"/>
<text x="90" y="67" class="mono" font-size="14" letter-spacing="3" fill="#8bd450">ACOUSTIC ANOMALY DETECTION · BUILT FOR MSMEs</text>
<text x="58" y="124" class="sans" font-size="64" font-weight="800" fill="#f4f1e6" letter-spacing="-1">Sound<tspan fill="#c8ff47">Guard</tspan></text>
<text x="60" y="158" class="sans" font-size="21" fill="#b9c3b2">Listen to the machine. Catch the fault before it costs you.</text>

<g class="mono" font-size="13">
  <rect x="842" y="40" width="298" height="30" rx="15" fill="#c8ff47" fill-opacity=".08" stroke="#c8ff47" stroke-opacity=".35"/>
  <text x="991" y="60" text-anchor="middle" fill="#dff7a8">DCASE 2020 · pump 04 · AUC 0.976</text>
</g>

